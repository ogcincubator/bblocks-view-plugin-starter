name: Build and typecheck

# This is a clone-and-adapt template, not a package anyone loads by URL or depends on -- so this
# workflow only verifies the skeleton/examples still build and typecheck, it doesn't publish
# anything anywhere.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
